name: Metrics
# ------------------------------------------------------------------
# TECH STACK ("Mastered technologies" row):
# plugin_topics (below) only shows icons for GitHub *topics you've
# starred*. There's no config that injects a fixed badge list into
# the SVG — it has to come from real starred-topic data. One-time
# setup: visit each link below and click the star on that topic page.
# Not every tool has a topic icon in metrics' icon set — expect these
# to render: c, cplusplus, python, typescript, java, numpy, pandas,
# scikit-learn, tensorflow, keras, matplotlib, dotnet, vercel, netlify,
# figma. LaTeX, R, Canva, Swagger, Notion, CSS3 may not have a mapped
# icon and could be skipped by the plugin even if starred.
#
#   https://github.com/topics/c
#   https://github.com/topics/cplusplus
#   https://github.com/topics/python
#   https://github.com/topics/typescript
#   https://github.com/topics/java
#   https://github.com/topics/numpy
#   https://github.com/topics/pandas
#   https://github.com/topics/scikit-learn
#   https://github.com/topics/tensorflow
#   https://github.com/topics/keras
#   https://github.com/topics/matplotlib
#   https://github.com/topics/dotnet
#   https://github.com/topics/vercel
#   https://github.com/topics/netlify
#   https://github.com/topics/figma
#   https://github.com/topics/r
#   https://github.com/topics/latex
#   https://github.com/topics/css
#   https://github.com/topics/notion
#   https://github.com/topics/swagger
# ------------------------------------------------------------------
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg

          # --- Layout: two columns (smaller font below helps offset
          #     the known columns height-clipping bug — #839/#814) ---
          config_display: columns
          config_timezone: Asia/Kolkata

          # --- Render order: isocalendar earlier so it's less likely
          #     to get pushed past the fixed viewbox height ---
          config_order: header, isocalendar, activity+community, repositories, habits, languages, pagespeed, music, topics, projects

          # --- Header / activity / community / repos ---
          base: header, activity, community, repositories

          # --- Isometric contributions calendar (also renders streak stats natively) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- Coding habits: per-hour + per-day charts + language activity bar ---
          plugin_habits: yes
          plugin_habits_charts: per-day, per-hour, languages
          plugin_habits_days: 14
          plugin_habits_from: 100
          plugin_habits_charts_type: classic

          # --- Most used languages ---
          plugin_languages: yes
          plugin_languages_details: bytes-size
          plugin_languages_ignored: html, css

          # --- PageSpeed Insights ---
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://your-website.com
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
          plugin_pagespeed_detailed: yes

          # --- Suggested tracks (Apple Music only reliably supports playlist mode) ---
          plugin_music: yes
          plugin_music_playlist: https://embed.music.apple.com/us/playlist/todays-hits/pl.f4d106fed2bd41149aaacabb233eb5eb
          plugin_music_limit: 2

          # --- Mastered technologies (pulls from GitHub topics YOU'VE STARRED — see notes) ---
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_limit: 0

          # --- Projects (often errors — GitHub deprecated classic Projects API for most accounts) ---
          plugin_projects: yes

          # --- Theme: dark background, typewriter font, smaller size, ONLY headings gold ---
          extras_css: |
            @font-face {
              font-family: 'Courier Prime';
              src: local('Courier New'), local('Courier');
            }
            :root {
              --color-canvas-default: #0d0d0d !important;
              --color-canvas-subtle: #161616 !important;
              --color-border-default: #FFD700 !important;
              --color-fg-default: #ffffff !important;
              --color-fg-muted: #ffffff !important;
            }
            svg, body {
              background-color: #0d0d0d !important;
              font-family: 'Courier Prime', 'Courier New', Courier, monospace !important;
              font-size: 11px !important;
            }
            .field, .field * , .field svg {
              color: #ffffff !important;
              fill: #ffffff !important;
            }
            h1, h2, h1 *, h2 * {
              color: #FFD700 !important;
              font-size: 15px !important;
            }
